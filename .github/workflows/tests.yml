# Only on dev/d395-medida: the D395 measurement on Linux, Python 3.11 with
# three PySide6 versions. Not the suite. The branch is deleted after.
name: tests

on:
  push:
    branches: ["dev/**"]

jobs:
  probe:
    name: D395 None on 3.11, PySide6 ${{ matrix.pyside }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pyside: ["6.12.0", "6.11.3", "6.10.3"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install system libraries for Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-cursor0
      - name: Install the project with the PySide6 of the matrix
        run: |
          python -m pip install --upgrade pip
          pip install -e . "PySide6==${{ matrix.pyside }}"
          pip list 2>/dev/null | grep -i -E "pyside|shiboken"
      - name: Probe
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUNBUFFERED: "1"
        run: |
          set +e
          python tests/_d395_probe.py calls;   echo "[D395] calls EXIT=$?"
          python tests/_d395_probe.py program; echo "[D395] program EXIT=$?"
          python tests/_d395_probe.py redraws 2>&1 | grep -E "D395|Fatal|none_dealloc" | tail -8
          echo "[D395] redraws EXIT=${PIPESTATUS[0]}"
