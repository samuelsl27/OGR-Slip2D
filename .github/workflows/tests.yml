# SPDX-License-Identifier: AGPL-3.0-or-later
name: tests

on:
  push:
    branches: [main, master, "dev/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  # dev/d370-shutdown, fourth round: each test of the two files that die with
  # «shared QObject was deleted directly» when run alone, by itself.
  test:
    name: "D370 ${{ matrix.t }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {f: "test_assign_water_surface_v195.py", t: "test_before_the_assignment_the_material_is_dry"}
          - {f: "test_assign_water_surface_v195.py", t: "test_assigning_makes_u_the_documented_closed_form"}
          - {f: "test_assign_water_surface_v195.py", t: "test_writing_only_the_id_would_have_changed_nothing"}
          - {f: "test_assign_water_surface_v195.py", t: "test_an_untouched_material_stays_dry"}
          - {f: "test_assign_water_surface_v195.py", t: "test_unticking_puts_the_material_back_to_dry"}
          - {f: "test_assign_water_surface_v195.py", t: "test_a_material_on_ru_keeps_its_own_model_when_cleared"}
          - {f: "test_assign_water_surface_v195.py", t: "test_a_water_table_gets_the_water_table_model"}
          - {f: "test_assign_water_surface_v195.py", t: "test_current_column_reports_none_when_unassigned"}
          - {f: "test_assign_water_surface_v195.py", t: "test_boxes_open_pre_ticked_to_the_current_state"}
          - {f: "test_assign_water_surface_v195.py", t: "test_select_all_and_clear_all"}
          - {f: "test_assign_water_surface_v195.py", t: "test_only_materials_pointing_here_are_reported_as_cleared"}
          - {f: "test_assign_water_surface_v195.py", t: "test_preselect_picks_the_boundary_just_drawn"}
          - {f: "test_assign_water_surface_v195.py", t: "test_the_title_names_the_surface"}
          - {f: "test_assign_water_surface_v195.py", t: "test_the_switch_is_on_by_default"}
          - {f: "test_assign_water_surface_v195.py", t: "test_nothing_opens_when_the_switch_is_off"}
          - {f: "test_assign_water_surface_v195.py", t: "test_a_water_surface_triggers_the_prompt"}
          - {f: "test_assign_water_surface_v195.py", t: "test_a_material_boundary_does_not"}
          - {f: "test_assign_water_surface_v195.py", t: "test_no_materials_means_no_prompt"}
          - {f: "test_transient_no_stages_v1306.py", t: "test_it_accepts_no_stages_and_keeps_the_capture"}
          - {f: "test_transient_no_stages_v1306.py", t: "test_clear_is_written_on_ok_and_cancel_writes_nothing"}
          - {f: "test_transient_no_stages_v1306.py", t: "test_it_says_which_initial_state_and_that_there_is_no_stage"}
          - {f: "test_transient_no_stages_v1306.py", t: "test_without_a_mesh_there_is_nothing_to_capture"}
          - {f: "test_transient_no_stages_v1306.py", t: "test_initial_state_first_then_the_stage"}
          - {f: "test_transient_no_stages_v1306.py", t: "test_nothing_is_computed_and_it_says_why"}
          - {f: "test_transient_no_stages_v1306.py", t: "test_switched_on_in_project_settings"}
          - {f: "test_transient_no_stages_v1306.py", t: "test_control_with_one_stage_it_computes"}
          - {f: "test_transient_no_stages_v1306.py", t: "test_the_engine"}
          - {f: "test_transient_no_stages_v1306.py", t: "test_transient_set_accepts_it_and_groundwater_run_refuses"}
          - {f: "test_transient_no_stages_v1306.py", t: "test_switched_on_by_settings_set"}
          - {f: "test_transient_no_stages_v1306.py", t: "test_control_with_one_stage_they_compute"}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install system libraries for Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-cursor0
      - name: Install the project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[mcp]"
      - name: One test, normal ending
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUNBUFFERED: "1"
          OGR_D370: census
        run: |
          set +e
          echo "D370 test: ${{ matrix.f }} :: ${{ matrix.t }}"
          python tests/_runner.py ${{ matrix.f }} -k ${{ matrix.t }}
          echo "D370 EXIT=$?"

  licence:
    name: Licence consistency
    runs-on: ubuntu-latest
    steps:
      # Same majors as the test job, for the same reason; see above.
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check SPDX headers and packaging metadata
        # Runs standalone: it only reads files, so it needs no
        # dependencies and gives fast feedback on a licence slip.
        # The block scalar (`|`) is not cosmetic: with a plain scalar YAML
        # folds every line into one, the heredoc never meets its `PY`
        # terminator and the step dies before running a single check.
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "tests")
          import test_license_v143 as t
          failed = 0
          for name in dir(t):
              if not name.startswith("Test"):
                  continue
              inst = getattr(t, name)()
              for m in dir(inst):
                  if m.startswith("test_"):
                      try:
                          getattr(inst, m)()
                      except Exception as exc:
                          failed += 1
                          print(f"FAIL {name}.{m}: {exc}")
          print("licence checks failed:", failed)
          sys.exit(1 if failed else 0)
          PY
