name: tests

on:
  push:
    branches: [main, master, "dev/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  # dev/d370-shutdown, third round: None's reference count per call on 3.11
  # and 3.12 (the aborts were «none_dealloc» on 3.11), and each file of the
  # two eighths that died with «shared QObject was deleted directly», alone.
  none:
    name: "D370 None refcount on ${{ matrix.py }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        py: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "${{ matrix.py }}"
          cache: pip
      - name: Install system libraries for Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-cursor0
      - name: Install the project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[mcp]"
      - name: None's count per call
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUNBUFFERED: "1"
        run: |
          set +e
          python tests/_d370_none.py
          echo "D370 EXIT=$?"

  file:
    name: "D370 slice ${{ matrix.s }}/8 part ${{ matrix.p }}/8, file ${{ matrix.k }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {s: 0, p: 3, k: 0}
          - {s: 0, p: 3, k: 1}
          - {s: 0, p: 3, k: 2}
          - {s: 0, p: 3, k: 3}
          - {s: 0, p: 3, k: 4}
          - {s: 0, p: 3, k: 5}
          - {s: 0, p: 3, k: 6}
          - {s: 0, p: 3, k: 7}
          - {s: 7, p: 2, k: 0}
          - {s: 7, p: 2, k: 1}
          - {s: 7, p: 2, k: 2}
          - {s: 7, p: 2, k: 3}
          - {s: 7, p: 2, k: 4}
          - {s: 7, p: 2, k: 5}
          - {s: 7, p: 2, k: 6}
          - {s: 7, p: 2, k: 7}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install system libraries for Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-cursor0
      - name: Install the project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[mcp]"
      - name: One file, normal ending
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUNBUFFERED: "1"
          OGR_D370: census
        run: |
          set +e
          FILES=$(python tests/_d370_slices.py ${{ matrix.s }} 8 ${{ matrix.p }} 8)
          FILE=$(echo $FILES | cut -d' ' -f$(( ${{ matrix.k }} + 1 )))
          echo "D370 file: $FILE"
          python tests/_runner.py $FILE
          echo "D370 EXIT=$?"

  licence:
    name: Licence consistency
    runs-on: ubuntu-latest
    steps:
      # Same majors as the test job, for the same reason; see above.
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check SPDX headers and packaging metadata
        # Runs standalone: it only reads files, so it needs no
        # dependencies and gives fast feedback on a licence slip.
        # The block scalar (`|`) is not cosmetic: with a plain scalar YAML
        # folds every line into one, the heredoc never meets its `PY`
        # terminator and the step dies before running a single check.
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "tests")
          import test_license_v143 as t
          failed = 0
          for name in dir(t):
              if not name.startswith("Test"):
                  continue
              inst = getattr(t, name)()
              for m in dir(inst):
                  if m.startswith("test_"):
                      try:
                          getattr(inst, m)()
                      except Exception as exc:
                          failed += 1
                          print(f"FAIL {name}.{m}: {exc}")
          print("licence checks failed:", failed)
          sys.exit(1 if failed else 0)
          PY
