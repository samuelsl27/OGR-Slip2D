# SPDX-License-Identifier: AGPL-3.0-or-later
name: tests

on:
  push:
    branches: [main, master, "dev/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  # dev/d370-shutdown, second round. test_slice_store_parallel_v1409 now
  # starts its process in a session of its own: its Job.cancel killed the
  # whole process group of the suite on Linux (and gdb's inferior, and the
  # CI step with its log). Python 3.11 only; every step prints its exit code.
  reproduce:
    name: "D370 whole suite, normal ending"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install system libraries for Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-cursor0 gdb
      - name: Install the project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[mcp]"
      - name: Whole suite, census at the end
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUNBUFFERED: "1"
          OGR_D370: census
        run: |
          set +e
          python tests/_runner.py
          echo "D370 EXIT=$?"

  gdb:
    name: "D370 gdb on slice ${{ matrix.s }} of 8"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        s: [0, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install system libraries for Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-cursor0 gdb
      - name: Install the project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[mcp]"
      - name: The slice under gdb, no probe
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUNBUFFERED: "1"
          S: ${{ matrix.s }}
        run: |
          set +e
          FILES=$(python tests/_d370_slices.py $S 8)
          gdb -batch -ex "set pagination off" -ex "set confirm off" -ex "handle SIGPIPE nostop noprint pass" -ex run -ex "info threads" -ex "thread apply all bt 50" --args python tests/_runner.py $FILES
          echo "D370 EXIT=$?"

  byhand:
    name: "D370 by hand, slice 0 of 8"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install system libraries for Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-cursor0 gdb
      - name: Install the project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[mcp]"
      - name: Slice 0, then each window without a parent deleted with Python alive
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUNBUFFERED: "1"
          OGR_D370: byhand
        run: |
          set +e
          python tests/_runner.py $(python tests/_d370_slices.py 0 8)
          echo "D370 EXIT=$?"

  sub:
    name: "D370 slice ${{ matrix.s }}/8, part ${{ matrix.k }}/8"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        s: [0, 7]
        k: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install system libraries for Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-cursor0 gdb
      - name: Install the project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[mcp]"
      - name: One eighth of the slice, normal ending
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUNBUFFERED: "1"
          OGR_D370: census
          S: ${{ matrix.s }}
          K: ${{ matrix.k }}
        run: |
          set +e
          FILES=$(python tests/_d370_slices.py $S 8 $K 8)
          echo "D370 part $S/$K: $FILES"
          python tests/_runner.py $FILES
          echo "D370 EXIT=$?"

  licence:
    name: Licence consistency
    runs-on: ubuntu-latest
    steps:
      # Same majors as the test job, for the same reason; see above.
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check SPDX headers and packaging metadata
        # Runs standalone: it only reads files, so it needs no
        # dependencies and gives fast feedback on a licence slip.
        # The block scalar (`|`) is not cosmetic: with a plain scalar YAML
        # folds every line into one, the heredoc never meets its `PY`
        # terminator and the step dies before running a single check.
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "tests")
          import test_license_v143 as t
          failed = 0
          for name in dir(t):
              if not name.startswith("Test"):
                  continue
              inst = getattr(t, name)()
              for m in dir(inst):
                  if m.startswith("test_"):
                      try:
                          getattr(inst, m)()
                      except Exception as exc:
                          failed += 1
                          print(f"FAIL {name}.{m}: {exc}")
          print("licence checks failed:", failed)
          sys.exit(1 if failed else 0)
          PY
