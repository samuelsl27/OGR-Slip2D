name: tests

on:
  push:
    branches: [main, master, "dev/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  # dev/d370-shutdown — diagnosis of D370 only; this file never goes to main.
  # Every job is Python 3.11 (the fastest), ends through the interpreter's
  # normal shutdown and prints its exit code instead of failing the step,
  # so the later steps and the log always say what happened.
  reproduce:
    name: "D370 reproduce + census"
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install system libraries for Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3             libxcb-icccm4 libxcb-image0 libxcb-keysyms1             libxcb-randr0 libxcb-render-util0 libxcb-shape0             libxcb-xinerama0 libxcb-cursor0 gdb
      - name: Install the project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[mcp]"
      - name: Whole suite, normal ending, probe in census mode
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUNBUFFERED: "1"
          OGR_D370: census
        run: |
          set +e
          python tests/_runner.py
          echo "D370 EXIT=$?"

  gdb:
    name: "D370 native stack (gdb)"
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install system libraries for Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3             libxcb-icccm4 libxcb-image0 libxcb-keysyms1             libxcb-randr0 libxcb-render-util0 libxcb-shape0             libxcb-xinerama0 libxcb-cursor0 gdb
      - name: Install the project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[mcp]"
      - name: Whole suite under gdb, no probe
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUNBUFFERED: "1"
        run: |
          set +e
          gdb -batch -ex "set pagination off" -ex "set confirm off"             -ex "handle SIGPIPE nostop noprint pass"             -ex run -ex "info threads" -ex "thread apply all bt 40"             --args python tests/_runner.py
          echo "D370 EXIT=$?"

  byhand:
    name: "D370 delete top-level widgets by hand"
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install system libraries for Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3             libxcb-icccm4 libxcb-image0 libxcb-keysyms1             libxcb-randr0 libxcb-render-util0 libxcb-shape0             libxcb-xinerama0 libxcb-cursor0 gdb
      - name: Install the project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[mcp]"
      - name: Whole suite, then each top-level widget deleted with Python alive
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUNBUFFERED: "1"
          OGR_D370: byhand
        run: |
          set +e
          python tests/_runner.py
          echo "D370 EXIT=$?"

  app:
    name: "D370 the program itself"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install system libraries for Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3             libxcb-icccm4 libxcb-image0 libxcb-keysyms1             libxcb-randr0 libxcb-render-util0 libxcb-shape0             libxcb-xinerama0 libxcb-cursor0 gdb
      - name: Install the project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[mcp]"
      - name: OGR Slip2D, demo, compute, interpret, close, normal exit
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUNBUFFERED: "1"
          OGR_D370: census
        run: |
          set +e
          python tests/_d370_app.py --no-agent-bridge
          echo "D370 EXIT (no bridge)=$?"
          python tests/_d370_app.py
          echo "D370 EXIT (with bridge)=$?"

  slices:
    name: "D370 slice ${{ matrix.k }} of 8"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        k: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install system libraries for Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3             libxcb-icccm4 libxcb-image0 libxcb-keysyms1             libxcb-randr0 libxcb-render-util0 libxcb-shape0             libxcb-xinerama0 libxcb-cursor0 gdb
      - name: Install the project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[mcp]"
      - name: One alphabetical eighth of the suite, normal ending
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUNBUFFERED: "1"
          OGR_D370: census
          K: ${{ matrix.k }}
        run: |
          set +e
          FILES=$(python - <<'PY'
          import glob, os
          fs = sorted(os.path.basename(p) for p in glob.glob("tests/test_*.py"))
          k, n = int(os.environ["K"]), 8
          size = -(-len(fs) // n)
          print(" ".join(fs[k * size:(k + 1) * size]))
          PY
          )
          echo "D370 slice $K: $(echo $FILES | wc -w) files, $(echo $FILES | cut -d' ' -f1) .. $(echo $FILES | awk '{print $NF}')"
          python tests/_runner.py $FILES
          echo "D370 EXIT=$?"

  licence:
    name: Licence consistency
    runs-on: ubuntu-latest
    steps:
      # Same majors as the test job, for the same reason; see above.
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check SPDX headers and packaging metadata
        # Runs standalone: it only reads files, so it needs no
        # dependencies and gives fast feedback on a licence slip.
        # The block scalar (`|`) is not cosmetic: with a plain scalar YAML
        # folds every line into one, the heredoc never meets its `PY`
        # terminator and the step dies before running a single check.
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "tests")
          import test_license_v143 as t
          failed = 0
          for name in dir(t):
              if not name.startswith("Test"):
                  continue
              inst = getattr(t, name)()
              for m in dir(inst):
                  if m.startswith("test_"):
                      try:
                          getattr(inst, m)()
                      except Exception as exc:
                          failed += 1
                          print(f"FAIL {name}.{m}: {exc}")
          print("licence checks failed:", failed)
          sys.exit(1 if failed else 0)
          PY
