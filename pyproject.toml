[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ogr-slip2d"
version = "0.1.490"
description = "OGR Slip2D — open-source slope stability and groundwater analysis (OpenGeoRock Suite)"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "AGPL-3.0-or-later"}
authors = [
    {name = "Samuel Sáez López", email = "samuel.saez@edu.upct.es"},
]
keywords = ["geotechnical", "slope-stability", "limit-equilibrium", "FEM", "seepage"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    # v0.1.473 (spec 010) -- the shared core, pinned to its tag: geometry,
    # materials, project, DXF, reports, and the finite-element mesh and
    # seepage that were ogr_fem2d. Its code is changed only in OGR-Core.
    # v0.1.474 -- v0.2.1: the leak detector lets through the locale that the
    # first QApplication adopts on Unix (the LEAK of the Linux CI).
    # v0.1.475 -- v0.2.2: a run with --dev-core tells its tests
    # (OGR_DEV_CORE=1, dev_core_run()), so this suite can come out green
    # against the core of an OGR-Core PR.
    # v0.1.486 -- v0.2.7: the DXF reader can keep arcs (keep_arcs, off by
    # default) and reads a bulge over half a turn (|b| > 1) and the bulges of
    # a 2-D POLYLINE right; nothing else this program uses changes.
    # v0.1.489 -- v0.2.10: Sarma's report row is «Number of Wedges Asked
    # For» (D454); 0.2.8 reads DXF entities in their own coordinates (OCS)
    # and 0.2.9 adds ogr_core.api, which this program does not use yet.
    "ogr-core @ git+https://github.com/samuelsl27/OGR-Core@v0.2.10",
    "numpy>=1.26",
    "scipy>=1.14",
    "shapely>=2.0",
    "ezdxf>=1.1",
    "h5py>=3.10",
    "matplotlib>=3.8",
    # v0.1.483 (D395) -- not 6.12.0 on Python 3.11. On Linux its bindings
    # take one reference from None on nearly every QGraphicsItem setter
    # (setPen, setBrush, setPos, setZValue, setVisible, setLine...), and
    # on 3.11 None is not immortal yet (PEP 683 is 3.12): the program
    # aborts with "none_dealloc" after ~880 redraws of the demo, ~47 once
    # it is computed. 6.11.3 and 6.10.3 lose nothing there, and on Windows
    # none of the three does (run 45127694244, tag archivo/dev-d395-medida).
    # macOS was not measured, so the exclusion is for every platform.
    "PySide6>=6.6,!=6.12.0; python_version < '3.12'",
    "PySide6>=6.6; python_version >= '3.12'",
    "qtawesome>=1.3",
    "typer>=0.9",
    "rich>=13.7",
    "pydantic>=2.5",
    "reportlab>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-qt>=4.2", "black", "ruff", "mypy"]
docs = ["sphinx>=7.0", "sphinx-rtd-theme"]
# v0.1.195 (spec 008) — the MCP server for AI agents. MIT; its whole tree
# (MIT, BSD-3-Clause, Apache-2.0, PSF-2.0, MIT-0) is AGPL-compatible.
mcp = ["mcp>=2.1,<3"]

[project.scripts]
ogr-slip2d = "ogr_gui.__main__:main"
ogr-slip2d-cli = "ogr_cli.__main__:app"
ogr-slip2d-mcp = "ogr_mcp.cli:main"

[project.urls]
Homepage = "https://github.com/samuelsl27/OGR-Slip2D"
Documentation = "https://opengeorock.org"
Repository = "https://github.com/samuelsl27/OGR-Slip2D"

[tool.setuptools.packages.find]
where = ["."]
include = ["ogr_*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict_optional = true
