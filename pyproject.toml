[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ogr-slip2d"
version = "0.1.122"
description = "OGR Slip2D — open-source slope stability and groundwater analysis (OpenGeoRock Suite)"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "AGPL-3.0-or-later"}
authors = [
    {name = "Samuel Sáez López", email = "samuel.saez@edu.upct.es"},
]
keywords = ["geotechnical", "slope-stability", "limit-equilibrium", "FEM", "seepage"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "shapely>=2.0",
    "pyclipper>=1.3",
    "ezdxf>=1.1",
    "h5py>=3.10",
    "matplotlib>=3.8",
    "PySide6>=6.6",
    "qtawesome>=1.3",
    "typer>=0.9",
    "rich>=13.7",
    "pydantic>=2.5",
    "reportlab>=4.0",
]

[project.optional-dependencies]
fem = ["scikit-fem>=9.0", "meshpy>=2022.1"]
dev = ["pytest>=7.4", "pytest-qt>=4.2", "black", "ruff", "mypy"]
docs = ["sphinx>=7.0", "sphinx-rtd-theme"]

[project.scripts]
ogr-slip2d = "ogr_gui.__main__:main"
ogr-slip2d-cli = "ogr_cli.__main__:app"

[project.urls]
Homepage = "https://github.com/samuelsl27/OGR-Slip2D"
Documentation = "https://opengeorock.org"
Repository = "https://github.com/samuelsl27/OGR-Slip2D"

[tool.setuptools.packages.find]
where = ["."]
include = ["ogr_*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict_optional = true
